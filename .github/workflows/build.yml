name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        shell: bash
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p build
          go build -trimpath -ldflags "-s -w -X main.Version=$(VERSION) -X main.GitCommit=$(GIT_COMMIT)" -o build/servicewrapper.exe servicewrapper.go

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/servicewrapper.exe -DestinationPath build/servicewrapper-windows-${{ matrix.goarch }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: servicewrapper-windows-${{ matrix.goarch }}
          path: build/servicewrapper-windows-${{ matrix.goarch }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: servicewrapper-windows-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum servicewrapper-windows-*.zip > checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            servicewrapper-windows-*.zip
            checksums.txt
          generate_release_notes: true
